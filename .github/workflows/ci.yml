name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check out sibling repositories
        run: |
          git clone --depth=1 https://github.com/authdiff-labs/auth-tree-core.git ../auth-tree-core
          git clone --depth=1 https://github.com/authdiff-labs/fixtures.git ../fixtures
          git clone --depth=1 https://github.com/authdiff-labs/frontend.git ../frontend
      - run: npm ci
      - run: npm test
